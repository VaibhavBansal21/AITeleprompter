<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Prompter</title>
<style>
  :root {
    --background: #fff;
    --text: #000;
    --spoken-red: #fa233b;
    --next-blue: #007aff;
    --font-size: 56px;
  }
  :root[data-theme="night"] { --background: #000; --text: #fff; --next-blue: #0a84ff; }

  body {
    margin: 0; background: var(--background); color: var(--text);
    font: 16px -apple-system, "SF Pro Display", system-ui, sans-serif;
    transition: background .3s, color .3s;
  }
  button, .file-button {
    font: inherit; padding: 8px 16px; cursor: pointer; border-radius: 999px;
    border: 1px solid color-mix(in srgb, var(--text) 25%, transparent);
    background: transparent; color: var(--text);
  }

  /* Setup screen */
  #setup { max-width: 800px; margin: 40px auto; padding: 0 16px; }
  #script-input {
    width: 100%; height: 50vh; box-sizing: border-box; padding: 12px; font: inherit; border-radius: 12px;
    background: color-mix(in srgb, var(--text) 6%, var(--background)); color: var(--text);
    border: 1px solid color-mix(in srgb, var(--text) 20%, transparent);
  }
  .setup-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
  #start-button { background: var(--spoken-red); color: #fff; border-color: transparent; font-weight: 600; }
  #file-input { display: none; }
  #error-message { color: var(--spoken-red); }

  /* Prompter screen (lyrics style) */
  /* Its own scroll area under the toolbar: only the text moves, never the page. */
  #prompter {
    display: none; position: fixed; inset: 48px 0 0 0; overflow-y: auto; scrollbar-width: none;
    padding: 0 max(6vw, calc((100vw - 1100px) / 2));
    font-size: var(--font-size); font-weight: 800; line-height: 1.25; letter-spacing: -0.02em;
    /* text fades out at the top and bottom edges */
    mask-image: linear-gradient(transparent, #000 12%, #000 80%, transparent);
  }
  /* Empty space above the first and below the last sentence, so both can reach the eye line. */
  #prompter::before { content: ''; display: block; height: 30vh; }
  #prompter::after { content: ''; display: block; height: 70vh; }
  .sentence { margin: 0 0 .6em; transition: filter .5s, opacity .5s; }
  .word { cursor: pointer; transition: color .35s, filter .35s, opacity .35s; }

  /* Not reached yet: blurry, more blur the farther away */
  .sentence.future { opacity: .45; filter: blur(calc(1px + var(--sentences-away) * 1px)); }
  /* Already spoken: blurry transparent red */
  .sentence.past .word,
  .sentence.active .word.spoken { color: var(--spoken-red); opacity: .4; filter: blur(2px); }
  /* The word you just said: solid red, moves forward as you speak */
  .sentence .word.just-spoken { color: var(--spoken-red); opacity: 1; filter: none; }
  /* The word to say next: solid blue */
  .sentence.active .word.next { color: var(--next-blue); }
  /* Rest of the current sentence: blue, fading with distance */
  .sentence.active .word.upcoming { color: var(--next-blue); opacity: max(.25, calc(.8 - var(--words-ahead) * .1)); }

  #toolbar {
    position: fixed; top: 0; left: 0; right: 0; height: 48px; box-sizing: border-box; z-index: 1;
    display: none; gap: 8px; padding: 0 16px; align-items: center;
    font-size: 14px; background: var(--background); transition: opacity .3s;
  }
  /* In full screen the toolbar dims so it doesn't distract; hover brings it back. */
  :fullscreen #toolbar { opacity: .15; }
  :fullscreen #toolbar:hover { opacity: 1; }
  #toolbar { padding-right: 72px; } /* room for the ☰ button */
  #toolbar button { padding: 6px 12px; }
  #status { margin-left: auto; }

  /* ☰ menu: speech engine choice. Native popover = closes on outside click / Esc. */
  #menu-button { position: fixed; top: 6px; right: 12px; z-index: 2; font-size: 20px; line-height: 1; padding: 6px 12px; }
  #menu {
    position: fixed; inset: 52px 12px auto auto; margin: 0; width: min(340px, calc(100vw - 24px)); padding: 12px;
    border-radius: 16px; border: 1px solid color-mix(in srgb, var(--text) 15%, transparent);
    background: var(--background); color: var(--text); box-shadow: 0 10px 40px rgb(0 0 0 / .2);
  }
  .menu-heading { margin: 0 0 8px; font-size: 13px; opacity: .6; }
  .menu-option { display: flex; gap: 10px; align-items: flex-start; padding: 10px; border-radius: 12px; cursor: pointer; }
  .menu-option:has(input:checked) { background: color-mix(in srgb, var(--next-blue) 12%, transparent); }
  .menu-option small { opacity: .65; }
  #menu > button { margin: 8px 8px 0 0; font-size: 13px; padding: 6px 12px; }

  /* API key dialog */
  #key-dialog { border: none; border-radius: 16px; padding: 20px; width: min(420px, calc(100vw - 32px)); background: var(--background); color: var(--text); }
  #key-dialog::backdrop { background: rgb(0 0 0 / .4); }
  #key-dialog h2 { margin-top: 0; }
  #key-input {
    width: 100%; box-sizing: border-box; margin-bottom: 10px; padding: 10px 12px; font: inherit; border-radius: 10px;
    border: 1px solid color-mix(in srgb, var(--text) 20%, transparent); background: transparent; color: var(--text);
  }
  .hint { font-size: 13px; opacity: .7; }
  .hint a { color: var(--next-blue); }
  #key-error { color: var(--spoken-red); min-height: 1.2em; font-size: 14px; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; }
  #key-submit { background: var(--next-blue); color: #fff; border-color: transparent; }
</style>
</head>
<body>
<div id="setup">
  <h1>Voice Prompter</h1>
  <textarea id="script-input" placeholder="Paste your script here, or open a file below…"></textarea>
  <div class="setup-actions">
    <button id="start-button">Start (enable mic)</button>
    <label class="file-button">Open file (PDF, Word, text)
      <input id="file-input" type="file" accept=".txt,.md,.pdf,.docx">
    </label>
    <button class="theme-button"></button>
    <select id="language-select" class="file-button" aria-label="Speech language">
      <option value="auto">Language: auto</option>
      <option value="en-IN">English (India)</option>
      <option value="en-US">English (US)</option>
      <option value="en-GB">English (UK)</option>
      <option value="hi-IN">Hindi</option>
    </select>
  </div>
  <p id="error-message"></p>
</div>

<div id="toolbar">
  <button id="edit-button">Edit script</button>
  <button id="smaller-font-button" aria-label="Smaller text">A−</button>
  <button id="bigger-font-button" aria-label="Bigger text">A+</button>
  <button class="theme-button"></button>
  <button id="fullscreen-button">Full screen</button>
  <span id="status"></span>
</div>
<div id="prompter"></div>

<button id="menu-button" popovertarget="menu" aria-label="Menu">☰</button>
<div id="menu" popover>
  <p class="menu-heading">Speech engine</p>
  <label class="menu-option">
    <input type="radio" name="engine" value="browser">
    <span><b>Browser</b> · free<br><small>Basic accuracy, may struggle with accents. Audio is processed by your browser's vendor (Google in Chrome).</small></span>
  </label>
  <label class="menu-option">
    <input type="radio" name="engine" value="ai">
    <span><b>AI</b> · Deepgram<br><small>Best accuracy, handles accents. Uses your own API key: about $0.46 per hour of speaking, silence not billed.</small></span>
  </label>
  <button id="change-key-button">Change API key</button>
  <button id="remove-key-button">Remove API key</button>
</div>

<dialog id="key-dialog">
  <form id="key-form" method="dialog">
    <h2>Connect Deepgram</h2>
    <input id="key-input" type="password" autocomplete="off" placeholder="Paste your Deepgram API key" required>
    <label><input id="remember-key" type="checkbox"> Remember on this device</label>
    <p class="hint">Your key is sent only to Deepgram, never to any other server.
      No key yet? <a href="https://console.deepgram.com/signup" target="_blank" rel="noopener">Get one free</a> ($200 credit).</p>
    <p id="key-error"></p>
    <div class="dialog-actions">
      <button value="cancel" formnovalidate>Cancel</button>
      <button id="key-submit" value="enable">Test &amp; enable</button>
    </div>
  </form>
</dialog>

<script type="module" src="app.js"></script>
<script defer src="/_vercel/insights/script.js"></script> <!-- Vercel Web Analytics: visitor counts -->
</body>
</html>
